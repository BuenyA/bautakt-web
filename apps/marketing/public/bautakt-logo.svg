<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 40" role="img" aria-label="Bautakt">
  <title>Bautakt</title>
  <!-- Signet: three vertical takt bars, ascending height -->
  <g fill="#1C1F26">
    <rect x="0" y="18" width="6" height="14" rx="3"/>
    <rect x="10" y="10" width="6" height="22" rx="3"/>
    <rect x="20" y="4" width="6" height="28" rx="3"/>
  </g>
  <!-- Wordmark -->
  <text x="36" y="28" font-family="Inter, Geist, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#1C1F26" letter-spacing="-0.02em">Bautakt</text>
</svg>
